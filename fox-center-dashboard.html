<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>폭스러닝센터 · 기획/팀장 운영 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e5e8ec; --line2:#eef0f4;
  --txt:#1f2937; --sub:#6b7280; --faint:#9ca3af;
  --fox:#f97316; --fox-soft:#fff3e8; --fox-deep:#c2540a;
  --red:#dc2626; --red-bg:#fee2e2; --orange:#ea580c; --orange-bg:#ffedd5;
  --yellow:#ca8a04; --yellow-bg:#fef9c3; --green:#16a34a; --green-bg:#dcfce7;
  --blue:#2563eb; --blue-bg:#dbeafe; --purple:#7c3aed; --purple-bg:#ede9fe;
  --gray:#4b5563; --gray-bg:#f3f4f6;
  --r:12px; --sh:0 1px 3px rgba(16,24,40,.05),0 1px 2px rgba(16,24,40,.03);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:13px;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--txt)}
a{color:var(--blue)}

/* ── Header ── */
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo h1{font-size:17px;font-weight:800;letter-spacing:-.2px}
.logo .sub{font-size:12px;color:var(--sub);font-weight:500}
.week-pill{background:var(--fox-soft);color:var(--fox-deep);font-weight:700;padding:5px 13px;border-radius:999px;font-size:12.5px}
.hd-sp{flex:1}
.hd-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-weight:600;color:var(--gray);font-size:12.5px}
.hd-btn:hover{background:var(--gray-bg)}
#saveStamp{font-size:11px;color:var(--faint)}

/* ── Tabs ── */
nav{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:63px;z-index:49}
nav button{padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--sub);border-bottom:2.5px solid transparent;white-space:nowrap}
nav button.on{color:var(--fox-deep);border-bottom-color:var(--fox)}
nav button:hover{color:var(--txt)}

main{max-width:1240px;margin:0 auto;padding:20px 24px 60px}
.tab{display:none}.tab.on{display:block}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.card h3{font-size:13.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card h3 .cnt{font-size:11px;background:var(--gray-bg);color:var(--sub);border-radius:999px;padding:1px 8px;font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1.2fr 1fr}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.muted{color:var(--faint);font-size:12.5px}
.empty{color:var(--faint);text-align:center;padding:22px 0;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px}

/* ── Stat cards ── */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;box-shadow:var(--sh);cursor:pointer;transition:transform .1s}
.stat:hover{transform:translateY(-2px)}
.stat .lb{font-size:12px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:6px}
.stat .num{font-size:25px;font-weight:800;margin-top:3px}
.stat.warn .num{color:var(--red)}

/* ── Badges ── */
.b-critical{background:var(--red-bg);color:var(--red)} .b-high{background:var(--orange-bg);color:var(--orange)}
.b-medium{background:var(--yellow-bg);color:var(--yellow)} .b-low{background:var(--green-bg);color:var(--green)}
.b-planned{background:var(--gray-bg);color:var(--gray)} .b-active{background:var(--blue-bg);color:var(--blue)}
.b-review{background:var(--purple-bg);color:var(--purple)} .b-done{background:var(--green-bg);color:var(--green)}
.b-hold{background:#e5e7eb;color:#374151}
.due{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}
.due-over{background:var(--red);color:#fff} .due-3{background:var(--orange-bg);color:var(--orange)}
.due-7{background:var(--yellow-bg);color:var(--yellow)} .due-ok{background:var(--gray-bg);color:var(--sub)}
.bdg{display:inline-flex;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}

/* ── Tables ── */
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--sub);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:#fafbfc}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:13px}
tr:hover td{background:#fafbfd}
.tbl-wrap{overflow-x:auto}
[contenteditable]{border-radius:6px;padding:3px 6px;min-width:40px;outline:none;transition:box-shadow .12s;cursor:text}
[contenteditable]:hover{background:var(--gray-bg)}
[contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px var(--fox)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--faint)}
select.cell{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 4px;font-weight:600;cursor:pointer;appearance:auto}
select.cell:hover{border-color:var(--line);background:#fff}
input.cell-date{border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px;cursor:pointer;width:118px}
input.cell-date:hover{border-color:var(--line);background:#fff}
.icon-btn{color:var(--faint);font-size:13px;padding:3px 6px;border-radius:6px}
.icon-btn:hover{background:var(--red-bg);color:var(--red)}

/* drag */
.handle{cursor:grab;color:var(--faint);font-size:14px;user-select:none;padding:2px 4px;border-radius:5px}
.handle:hover{background:var(--gray-bg);color:var(--txt)}
.exp-btn{color:var(--faint);font-size:10px;padding:3px 5px;border-radius:5px;font-weight:700}
.exp-btn:hover{background:var(--gray-bg);color:var(--txt)}
tr.hint-top td{box-shadow:inset 0 3px 0 var(--fox)}
tr.hint-bottom td{box-shadow:inset 0 -3px 0 var(--fox)}
tr.dragging td{opacity:.4}

/* progress */
.prog{display:flex;align-items:center;gap:6px}
.prog input[type=range]{width:64px;accent-color:var(--fox);cursor:pointer}
.prog .pv{font-size:11.5px;font-weight:700;color:var(--sub);width:32px}
.pbar{height:5px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:3px}
.pbar>div{height:100%;background:linear-gradient(90deg,#fb923c,#f97316);border-radius:99px}

/* 프로젝트 하위 단계(브랜치) */
tr.branch td{background:#fbfcff;border-bottom:1px solid var(--line2)}
tr.branch:hover td{background:#f5f8fd}
tr.branch td:first-child{box-shadow:inset 3.5px 0 0 #fdba74}
.br-name{display:flex;align-items:center;gap:5px}
.tree{color:var(--fox);font-weight:800;margin-left:9px;font-size:13px}
tr.br-add td{background:#fbfcff;border-bottom:1.5px solid var(--line)}
tr.br-add td:first-child{box-shadow:inset 3.5px 0 0 #fdba74}
.mini-btn{font-size:11.5px;font-weight:700;color:var(--fox-deep);background:var(--fox-soft);border-radius:6px;padding:4px 10px}
.mini-btn:hover{background:#ffe4cc}
.mini-btn.gray{background:var(--gray-bg);color:var(--gray)}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select,.toolbar input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.add-btn{background:var(--fox);color:#fff;font-weight:700;border-radius:8px;padding:8px 16px;font-size:13px;box-shadow:var(--sh)}
.add-btn:hover{background:#ea580c}

/* dashboard lists */
.top5-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line2)}
.top5-item:last-child{border-bottom:none}
.top5-item .rank{width:23px;height:23px;border-radius:7px;background:var(--fox-soft);color:var(--fox-deep);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top5-item .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.top5-item .nm:hover{color:var(--fox-deep)}
.blk-item{padding:8px 10px;border-left:3px solid var(--red);background:#fef7f7;border-radius:0 8px 8px 0;margin-bottom:8px}
.blk-item b{font-size:13px}
.blk-item .who{font-size:11.5px;color:var(--sub)}
.mtg-chk{display:flex;align-items:center;gap:8px;padding:5px 0}
.mtg-chk input[type=checkbox]{width:16px;height:16px;accent-color:var(--fox);cursor:pointer}
.mtg-chk .del{opacity:0;color:var(--faint)}
.mtg-chk:hover .del{opacity:1}
.mtg-chk span.done-lb{text-decoration:line-through;color:var(--faint)}
.pp-hot{color:var(--red);font-weight:800}

/* 담당자 칩 + 선택 팝업 */
.own-wrap{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:90px}
.own-chip{display:inline-flex;align-items:center;gap:4px;background:var(--gray-bg);border-radius:99px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.own-chip button{color:var(--faint);font-size:10px;padding:0 1px}
.own-chip button:hover{color:var(--red)}
.own-add{width:20px;height:20px;border-radius:99px;border:1px dashed var(--faint);color:var(--sub);font-size:12px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.own-add:hover{border-color:var(--fox);color:var(--fox-deep);background:var(--fox-soft)}
#pickPop{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(16,24,40,.16);padding:8px;min-width:190px;display:none}
#pickPop .pk-item{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;cursor:pointer;font-size:13px}
#pickPop .pk-item:hover{background:var(--gray-bg)}
#pickPop .pk-item input{accent-color:var(--fox);pointer-events:none}
#pickPop .pk-item span{flex:1}
#pickPop .pk-del{color:var(--faint);font-size:11px;padding:1px 5px;border-radius:5px;opacity:0}
#pickPop .pk-item:hover .pk-del{opacity:1}
#pickPop .pk-del:hover{background:var(--red-bg);color:var(--red)}
#pickPop .pk-new{display:flex;gap:6px;margin-top:6px;border-top:1px solid var(--line2);padding-top:8px}
#pickPop .pk-new input{flex:1;border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:90px}

/* meetings */
.pdf-link{font-weight:600;color:var(--blue);padding:3px 8px;border-radius:6px;font-size:12.5px}
.pdf-link:hover{background:var(--blue-bg)}

/* 보고 */
.rp-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);margin-bottom:14px}
.rp-bar select,.rp-bar input[type=date]{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.rp-bar input[type=text]{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:8px;padding:8px 11px}
.rp-bar input[type=text]:focus{outline:none;border-color:var(--fox)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:7px 12px;font-weight:600;color:var(--sub);background:#fff;font-size:12.5px}
.seg button.on{background:var(--fox);color:#fff}
.rp-date{font-weight:800;font-size:13.5px;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.rp-item{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line2)}
.rp-item:hover{background:#fafbfd}
.rp-item .del{opacity:0}
.rp-item:hover .del{opacity:1}
.rp-txt{flex:1;font-size:13.5px;line-height:1.5}
.bdg.k-daily{background:var(--gray-bg);color:var(--gray)}
.bdg.k-weekly{background:var(--green-bg);color:var(--green)}
.bdg.s-lab{background:var(--blue-bg);color:var(--blue)}
.bdg.s-center{background:var(--orange-bg);color:var(--orange)}
.rp-author{font-size:11.5px;font-weight:700;color:var(--sub);background:var(--gray-bg);border-radius:99px;padding:2px 9px;white-space:nowrap;margin-top:1px}
.agn-item{padding:8px 10px;border-left:3px solid var(--orange);background:#fff9f2;border-radius:0 8px 8px 0;margin-bottom:8px}
.agn-item b{font-size:13px}
.agn-item .who{font-size:11.5px;color:var(--sub)}

/* 월간 캘린더 */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-head .ttl{font-size:17px;font-weight:800;min-width:120px;text-align:center}
.cal-nav{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--sub)}
.cal-nav:hover{background:var(--gray-bg);color:var(--txt)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:0 0 var(--r) var(--r);overflow:hidden}
.calgrid .dow{background:#fafbfc;font-size:11.5px;font-weight:700;color:var(--sub);text-align:center;padding:7px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal-cell{min-height:96px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px 6px;cursor:pointer;background:#fff;overflow:hidden}
.cal-cell:hover{background:var(--fox-soft)}
.cal-cell.out{background:#fafbfc}
.cal-cell.out .dnum{color:var(--faint)}
.dnum{font-size:12px;font-weight:700;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:99px}
.dnum.sun{color:var(--red)} .dnum.sat{color:var(--blue)}
.cal-cell.today .dnum{background:var(--fox);color:#fff}
.ev{font-size:11px;border-radius:5px;padding:1.5px 6px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ev.due{background:var(--orange-bg);color:var(--orange)}
.ev.due.late{background:var(--red-bg);color:var(--red)}
.ev.plain{background:var(--blue-bg);color:var(--blue)}
.ev.more{background:var(--gray-bg);color:var(--sub);text-align:center}

/* 날짜 팝업 */
#dayPop{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 32px rgba(16,24,40,.18);padding:12px;width:280px;display:none}
#dayPop .dp-title{font-weight:800;font-size:13.5px;margin-bottom:8px}
#dayPop .dp-due{padding:6px 9px;border-left:3px solid var(--orange);background:#fff9f2;border-radius:0 7px 7px 0;margin-bottom:6px;cursor:pointer;font-size:12.5px;font-weight:600}
#dayPop .dp-due:hover{background:var(--orange-bg)}
#dayPop .dp-due .muted{font-weight:500}
#dayPop .dp-ev{display:flex;align-items:center;gap:4px;padding:2px 0}
#dayPop .dp-ev>span{flex:1;font-size:13px}
#dayPop .dp-new{display:flex;gap:6px;margin-top:8px;border-top:1px solid var(--line2);padding-top:9px}
#dayPop .dp-new input{flex:1;border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:80px}

/* 미니 캘린더 (대시보드) */
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mc-dow{font-size:10.5px;font-weight:700;color:var(--faint);padding:2px 0}
.mc-day{padding:3px 0 1px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;min-height:28px}
.mc-day:hover{background:var(--fox-soft)}
.mc-day.today{background:var(--fox);color:#fff;font-weight:800}
.mc-day.today .mc-dot{background:#fff!important}
.mc-dots{display:flex;gap:2px;justify-content:center;height:5px;margin-top:1px}
.mc-dot{width:4px;height:4px;border-radius:99px}

footer{max-width:1240px;margin:0 auto;padding:0 24px 40px;color:var(--faint);font-size:11.5px;display:flex;gap:14px;align-items:center}
footer button{color:var(--faint);text-decoration:underline;font-size:11.5px}

#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:#1f2937;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;transition:transform .25s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{transform:translateX(-50%) translateY(0)}

@media print{
  header .hd-btn,nav,footer,.toolbar,.icon-btn,.exp-btn,.add-btn,.mini-btn,.handle{display:none!important}
  body{background:#fff}
  .tab{display:none}.tab.on{display:block}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <h1>폭스러닝센터</h1>
    <div class="sub">기획/팀장 운영 시스템</div>
  </div>
  <div class="week-pill" id="weekPill"></div>
  <div class="hd-sp"></div>
  <span id="saveStamp"></span>
  <button class="hd-btn" onclick="exportJSON()">내보내기</button>
  <button class="hd-btn" onclick="document.getElementById('impFile').click()">가져오기</button>
  <button class="hd-btn" onclick="window.print()">인쇄</button>
</header>

<nav id="tabNav">
  <button data-t="dash" class="on">대시보드</button>
  <button data-t="proj">프로젝트</button>
  <button data-t="rep">보고</button>
  <button data-t="meet">회의록</button>
  <button data-t="cal">연간 캘린더</button>
  <button data-t="sop">운영 문서</button>
  <button data-t="comp">완료</button>
</nav>

<main>
  <section id="tab-dash" class="tab on"></section>
  <section id="tab-proj" class="tab"></section>
  <section id="tab-rep" class="tab"></section>
  <section id="tab-meet" class="tab"></section>
  <section id="tab-cal" class="tab"></section>
  <section id="tab-sop" class="tab"></section>
  <section id="tab-comp" class="tab"></section>
</main>

<footer>
  <span>링크를 가진 사람은 누구나 함께 보고 수정할 수 있습니다 · 변경 사항은 자동으로 팀 저장소에 동기화됩니다 (회의록 PDF만 각자 기기 보관 · 주기적으로 내보내기 백업 권장)</span>
  <span style="flex:1"></span>
  <button onclick="resetAll()">전체 초기화</button>
</footer>

<input type="file" id="impFile" accept=".json" hidden onchange="importJSON(this)">
<input type="file" id="pdfFile" accept="application/pdf,.pdf" hidden onchange="pdfChosen(this)">
<div id="pickPop" style="display:none" onclick="event.stopPropagation()"></div>
<div id="dayPop" style="display:none" onclick="event.stopPropagation()"></div>
<div id="toast"></div>

<script>
'use strict';
/* ═══════════════ 상수 ═══════════════ */
const LS_KEY = 'foxcenter.ops.v1';
const SYNC_URL = 'https://api.npoint.io/1cfdae95fc9b02674247'; // 팀 공유 저장소
const PRIO = {
  critical:{l:'Critical', o:0}, high:{l:'High', o:1},
  medium:{l:'Medium', o:2},    low:{l:'Low', o:3}
};
const STAT = { planned:'예정', active:'진행중', review:'검토중', done:'완료', hold:'보류' };

/* ═══════════════ 데이터 ═══════════════ */
let DB = null;
const EXP = new Set();
const F = { owner:'', status:'', prio:'', q:'' };

function defaults(){
  const y = new Date().getFullYear();
  return {
    seqP: 6, seqM: 1, seqF: 0, seqE: 0, seqR: 0,
    reports: [],
    members: ['준모','박미현','송센터장'],
    projects: [

function normalize(){
  const d = defaults();
  for(const k in d) if(DB[k]===undefined) DB[k]=d[k];
  // 구버전 회의록(안건/액션 구조) → PDF 보관함 구조로 이관
  DB.meetings = DB.meetings.map(m=>{
    if(m.agenda !== undefined){
      const title = (m.agenda||[]).map(a=>a.topic).filter(Boolean).join(', ') || '회의록';
      const note = (m.agenda||[]).map(a=>a.dec).filter(Boolean).join(' / ');
      return {id:m.id, date:m.date, title, note, fileId:'', fileName:''};
    }
    return m;
  });
  // 담당자 단일(owner 문자열) → 다중(owners 배열) 이관
  DB.projects.forEach(p=>{ if(!Array.isArray(p.owners)){ p.owners = p.owner ? [p.owner] : []; delete p.owner; } });
  DB.sops.forEach(s=>{ if(!Array.isArray(s.owners)){ s.owners = s.owner ? [s.owner] : []; delete s.owner; } });
  // 보고 필드 보정
  if(!Array.isArray(DB.reports)) DB.reports=[];
  if(typeof DB.seqR!=='number') DB.seqR=DB.reports.length;
  // 프로젝트 하위 단계(브랜치) 필드 보정
  if(typeof DB.seqB!=='number') DB.seqB=0;
  DB.projects.forEach(p=>{
    if(!Array.isArray(p.branches)) p.branches=[];
    p.branches.forEach(b=>{ if(!Array.isArray(b.owners)) b.owners=[]; });
  });
  // 구버전 연간 캘린더(월별 텍스트) → 일정(events)으로 이관
  if(!Array.isArray(DB.events)) DB.events=[];
  if(typeof DB.seqE!=='number') DB.seqE=DB.events.length;
  if(DB.calendar){
    const y=new Date().getFullYear();
    const L={ops:'운영',events:'행사',mkt:'마케팅',counsel:'상담',edu:'교육'};
    for(const m in DB.calendar){
      const c=DB.calendar[m]||{};
      for(const k in L){
        const v=(c[k]||'').trim(); if(!v) continue;
        const date=`${y}-${String(m).padStart(2,'0')}-01`, title=`[${L[k]}] ${v}`;
        if(!DB.events.some(e=>e.date===date && e.title===title))
          DB.events.push({id:'E'+(++DB.seqE), date, title});
      }
    }
    delete DB.calendar;
  }
  const wk = mondayISO(new Date());
  if(DB.weekly.week !== wk){
    DB.weekly.week = wk;
    DB.weekly.items.forEach(i=>i.d=false);
  }
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    DB = raw ? JSON.parse(raw) : defaults();
  }catch(e){ DB = defaults(); }
  normalize();
  save(false, false);
}
function setStat(t){ document.getElementById('saveStamp').textContent = t; }
function save(stamp=true, sync=true){
  if(sync) DB.updatedAt = new Date().toISOString();
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  if(stamp) setStat('저장됨 ' + new Date().toLocaleTimeString('ko-KR'));
  if(sync) queuePush();
}

/* ═══════════════ 팀 실시간 동기화 ═══════════════ */
let pushT=null, pushing=false, needPush=false;
function queuePush(){ needPush=true; clearTimeout(pushT); pushT=setTimeout(pushRemote, 1200); }
async function pushRemote(){
  if(pushing) return;
  pushing=true; setStat('동기화 중…');
  try{
    const res=await fetch(SYNC_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(DB)});
    if(!res.ok) throw new Error(res.status);
    needPush=false;
    setStat('팀 공유됨 ' + new Date().toLocaleTimeString('ko-KR'));
  }catch(e){
    setStat('동기화 실패 · 이 기기에는 저장됨 (자동 재시도)');
  }
  pushing=false;
}
function editingNow(){
  if(dragPid) return true;
  if(document.getElementById('pickPop').style.display==='block') return true;
  if(document.getElementById('dayPop').style.display==='block') return true;
  const a=document.activeElement;
  return !!(a && (a.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(a.tagName)));
}
async function pullRemote(initial=false){
  if(pushing || needPush) return;
  try{
    const res=await fetch(SYNC_URL+'?t='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const remote=await res.json();
    if(!remote || !Array.isArray(remote.projects)){
      if(DB.updatedAt) queuePush();  // 저장소가 비어있으면 내 데이터로 초기화
      return;
    }
    const r=remote.updatedAt||'', l=DB.updatedAt||'';
    if(r>l){
      if(!initial && editingNow()) return;  // 입력 중에는 다음 주기에 반영
      DB=remote; normalize();
      localStorage.setItem(LS_KEY, JSON.stringify(DB));
      render();
      setStat('팀 업데이트 받음 ' + new Date().toLocaleTimeString('ko-KR'));
    }else if(l>r){
      queuePush();
    }
  }catch(e){
    if(initial) setStat('오프라인 · 이 기기에만 저장됨');
  }
}

/* ═══════════════ IndexedDB (회의록 PDF 저장) ═══════════════ */
let idb = null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(idb) return res(idb);
    const r = indexedDB.open('foxcenter-files', 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('pdfs');
    r.onsuccess = ()=>{ idb=r.result; res(idb); };
    r.onerror = ()=> rej(r.error);
  });
}
async function filePut(id, blob){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('pdfs','readwrite');
    tx.objectStore('pdfs').put(blob, id);
    tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
  });
}
async function fileGet(id){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const rq = db.transaction('pdfs').objectStore('pdfs').get(id);
    rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>rej(rq.error);
  });
}
async function fileDel(id){
  const db = await idbOpen();
  return new Promise((res)=>{
    const tx = db.transaction('pdfs','readwrite');
    tx.objectStore('pdfs').delete(id);
    tx.oncomplete = res; tx.onerror = res;
  });
}

/* ═══════════════ 날짜 유틸 ═══════════════ */
function dISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return dISO(new Date()); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mondayISO(dt){ const d=new Date(dt); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtMD(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return (+m)+'/'+(+d); }
function fmtFull(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); const dow='일월화수목금토'[new Date(iso+'T00:00:00').getDay()]; return `${y}. ${+m}. ${+d} (${dow})`; }
function daysLeft(iso){ if(!iso) return null; const t=new Date(todayISO()+'T00:00:00'), d=new Date(iso+'T00:00:00'); return Math.round((d-t)/86400000); }
function dueBadge(p){
  if(!p.due) return '<span class="due due-ok">기한 없음</span>';
  const n = daysLeft(p.due);
  if(p.status==='done') return `<span class="due due-ok">${fmtMD(p.due)}</span>`;
  if(n<0)  return `<span class="due due-over">${fmtMD(p.due)} · ${-n}일 지연</span>`;
  if(n===0)return `<span class="due due-over">오늘 마감</span>`;
  if(n<=3) return `<span class="due due-3">${fmtMD(p.due)} · D-${n}</span>`;
  if(n<=7) return `<span class="due due-7">${fmtMD(p.due)} · D-${n}</span>`;
  return `<span class="due due-ok">${fmtMD(p.due)} · D-${n}</span>`;
}
function thisWeek(){ const mon = mondayISO(new Date()); return [mon, addDays(mon,6)]; }

/* ═══════════════ 공통 유틸 ═══════════════ */
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200); }
function ceKey(e){ if(e.key==='Enter' && !e.currentTarget.dataset.ml){ e.preventDefault(); e.currentTarget.blur(); } }
function ce(fn, ph, ml){
  return `contenteditable="true" data-ph="${esc(ph||'')}" ${ml?'data-ml="1"':''} onkeydown="ceKey(event)" onblur="${fn}"`;
}

function togglePick(mi){
  const m=DB.members[mi], arr=ownersOf(PICK.type,PICK.key);

function addPickMember(inp){
  const v=inp.value.trim(); if(!v) return;
  if(!DB.members.includes(v)) DB.members.push(v);

function miniCalHTML(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth()+1, today=todayISO();
  const map=calData();
  const first=new Date(y,m-1,1), off=first.getDay(), dim=new Date(y,m,0).getDate();
  const weeks=Math.ceil((off+dim)/7);
  let cells='';
  for(let i=0;i<weeks*7;i++){
    const dnum=i-off+1;
    if(dnum<1 || dnum>dim){ cells+='<div></div>'; continue; }
    const iso=`${y}-${String(m).padStart(2,'0')}-${String(dnum).padStart(2,'0')}`;
    const it=map[iso];
    const dots=it?`${it.dues.length?'<span class="mc-dot" style="background:var(--orange)"></span>':''}${it.evs.length?'<span class="mc-dot" style="background:var(--blue)"></span>':''}`:'';
    cells+=`<div class="mc-day ${iso===today?'today':''}" onclick="goCalDay('${iso}')">${dnum}<div class="mc-dots">${dots}</div></div>`;
  }
  return `<div class="mc-grid">
    ${DOW.map((d,i)=>`<div class="mc-dow" style="${i===0?'color:var(--red)':i===6?'color:var(--blue)':''}">${d}</div>`).join('')}
    ${cells}</div>`;
}
function goCalDay(iso){ const [y,m]=iso.split('-'); calY=+y; calM=+m; goTab('cal'); }

    <td><select class="cell b-${p.status}" style="border-radius:6px" onchange="upP('${p.id}','status',this.value)">

    <td><div class="prog">
      <input type="range" min="0" max="100" step="5" value="${p.prog}"
        oninput="this.nextElementSibling.textContent=this.value+'%'"
        onchange="upP('${p.id}','prog',+this.value)">
      <span class="pv">${p.prog}%</span></div>
      <div class="pbar"><div style="width:${p.prog}%"></div></div></td>
    <td ${ce(`upP('${p.id}','next',this.innerText)`,'메모')}>${esc(p.next)}</td>
    <td style="${p.blocker?'color:var(--red);font-weight:600':''}" ${ce(`upP('${p.id}','blocker',this.innerText)`,'없음')}>${esc(p.blocker)}</td>
    <td><button class="icon-btn" title="삭제" onclick="delProj('${p.id}')">🗑</button></td>
  </tr>`;
  if(!ex) return main;

  <tr class="branch">

    <td></td>
    <td>${ownerCell(b.owners,'br',p.id+'|'+b.id)}</td>

    <td><select class="cell b-${b.status}" style="border-radius:6px" onchange="upB('${p.id}','${b.id}','status',this.value)">

    <td><input type="date" class="cell-date" value="${b.due||''}" onchange="upB('${p.id}','${b.id}','due',this.value)"><br>${dueBadge(b)}</td>
    <td></td>
    <td ${ce(`upB('${p.id}','${b.id}','note',this.innerText)`,'메모')}>${esc(b.note)}</td>

function addBranch(pid){
  const p=P(pid); if(!Array.isArray(p.branches)) p.branches=[];
  p.branches.push({id:'B'+(++DB.seqB), name:'새 단계', owners:[], prio:'medium', status:'planned', due:'', note:'', issue:''});
  EXP.add(pid); save(); rProj();
}
function upB(pid,bid,k,v){
  const b=P(pid).branches.find(x=>x.id===bid); if(!b) return;
  b[k]=typeof v==='string'?v.trim():v;
  save(); render();
}
function delBranch(pid,bid){
  const p=P(pid), b=p.branches.find(x=>x.id===bid);
  if(!confirm(`'${b.name}' 단계를 삭제할까요?`)) return;
  p.branches=p.branches.filter(x=>x.id!==bid); save(); rProj();
}
function togEx(id){ EXP.has(id)?EXP.delete(id):EXP.add(id); rProj(); }
function upP(id,k,v){
  const p=P(id); if(!p) return;
  if(typeof v==='string') v=v.trim();
  p[k]=v;
  if(k==='status'){
    if(v==='done'){ p.doneAt=todayISO(); p.prog=100; toast(`'${p.name}' 완료 — 완료 탭으로 이동했습니다`); }
    else p.doneAt='';
  }
  save(); render();
}
function addProj(){

function delProj(id){
  const p=P(id);

  DB.projects=DB.projects.filter(x=>x.id!==id); save(); render();

/* ── 드래그 순서 이동 ── */
let dragPid=null;
function armDrag(id){ const tr=document.getElementById('row-'+id); if(tr) tr.draggable=true; }
function dragStart(e,id){ dragPid=id; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',id);}catch(_){} document.getElementById('row-'+id)?.classList.add('dragging'); }
function dragOver(e,id){
  if(!dragPid||dragPid===id) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  const tr=document.getElementById('row-'+id); if(!tr) return;
  const r=tr.getBoundingClientRect(), after=e.clientY > r.top+r.height/2;
  tr.classList.toggle('hint-top',!after); tr.classList.toggle('hint-bottom',after);
}
function dragLeave(e,id){ const tr=document.getElementById('row-'+id); if(tr){tr.classList.remove('hint-top','hint-bottom');} }
function dropRow(e,id){
  e.preventDefault();
  if(!dragPid||dragPid===id) return;
  const tr=document.getElementById('row-'+id);
  const r=tr.getBoundingClientRect(), after=e.clientY > r.top+r.height/2;
  const arr=DB.projects;
  const from=arr.findIndex(p=>p.id===dragPid);
  const item=arr.splice(from,1)[0];
  let to=arr.findIndex(p=>p.id===id);
  arr.splice(after?to+1:to, 0, item);
  dragPid=null; save(); rProj();
}
function dragEnd(e){
  dragPid=null;
  document.querySelectorAll('tr[id^="row-"]').forEach(tr=>{ tr.draggable=false; tr.classList.remove('hint-top','hint-bottom','dragging'); });
}

    : '<div class="empty">아직 보고가 없습니다 — 위 입력줄에서 바로 등록하세요</div>'}
  </div>
  <div class="muted">작성자와 구분은 이 기기에 기억됩니다 · 센터 공통 보고는 대시보드의 "센터 공통 안건" 카드에 자동으로 모입니다</div>`;
}
function segOn(btn){ [...btn.parentNode.children].forEach(b=>b.classList.toggle('on',b===btn)); }
function addReport(){
  const text=(document.getElementById('rpText').value||'').trim();
  const date=document.getElementById('rpDate').value||todayISO();
  const author=document.getElementById('rpAuthor').value;
  if(!author){ toast('작성자를 먼저 선택하세요'); document.getElementById('rpAuthor').focus(); return; }
  if(!text){ document.getElementById('rpText').focus(); return; }
  DB.reports.push({id:'R'+(++DB.seqR), date, kind:RP.kind, scope:RP.scope, author, text});
  RP.text='';
  save(); rRep();
  const inp=document.getElementById('rpText'); inp.value=''; inp.focus();
}
function upRep(id,v){
  const r=DB.reports.find(x=>x.id===id); if(!r) return;
  v=v.trim();
  if(!v) return rRep();
  r.text=v; save(); rRep();
}
function delRep(id){
  const r=DB.reports.find(x=>x.id===id);
  if(!confirm(`이 보고를 삭제할까요?\n"${r.text.slice(0,40)}${r.text.length>40?'…':''}"`)) return;
  DB.reports=DB.reports.filter(x=>x.id!==id); save(); rRep();
}

/* ═══════════════ 회의록 (날짜별 PDF 보관함) ═══════════════ */
function rMeet(){
  const list=[...DB.meetings].sort((a,b)=> a.date>b.date?-1 : a.date<b.date?1 : (a.id<b.id?1:-1));
  document.getElementById('tab-meet').innerHTML = `
  <div class="toolbar">
    <button class="add-btn" onclick="addMeet()">＋ 회의록 추가</button>
    <span class="muted">회의록 PDF를 올려두면 날짜별로 정리됩니다 · 파일명을 누르면 PDF가 열립니다</span>
  </div>
  <div class="card" style="padding:0"><div class="tbl-wrap">
  <table>
    <tr><th style="width:170px">날짜</th><th style="min-width:170px">제목</th><th style="min-width:200px">회의록 PDF</th><th style="min-width:200px">핵심 메모</th><th></th></tr>
    ${list.length ? list.map(m=>`<tr>
      <td><input type="date" class="cell-date" value="${m.date}" onchange="upM('${m.id}','date',this.value)"><div class="muted" style="font-size:11px;padding-left:5px">${fmtFull(m.date)}</div></td>
      <td style="font-weight:600" ${ce(`upM('${m.id}','title',this.innerText)`,'회의 제목')}>${esc(m.title)}</td>
      <td>${m.fileId
          ? `<button class="pdf-link" onclick="openPdf('${m.id}')">📄 ${esc(m.fileName||'회의록.pdf')}</button>
             <button class="icon-btn" title="파일 제거" onclick="removePdf('${m.id}')">✕</button>`
          : `<button class="mini-btn" onclick="pickPdf('${m.id}')">PDF 업로드</button>`}</td>
      <td class="muted" ${ce(`upM('${m.id}','note',this.innerText)`,'주요 결정·전달사항',1)}>${esc(m.note)}</td>
      <td><button class="icon-btn" onclick="delMeet('${m.id}')">🗑</button></td>
    </tr>`).join('') : '<tr><td colspan="5"><div class="empty">회의록이 없습니다 — 회의록 추가 버튼으로 시작하세요</div></td></tr>'}
  </table>
  </div></div>
  <div class="muted">PDF는 이 브라우저 안에 저장됩니다 (내보내기 JSON에는 목록만 포함, 파일은 포함되지 않습니다)</div>`;
}
function MT(id){ return DB.meetings.find(m=>m.id===id); }
function upM(id,k,v){ MT(id)[k]=typeof v==='string'?v.trim():v; save(); rMeet(); }
function addMeet(){
  const id='M'+String(++DB.seqM).padStart(3,'0');
  DB.meetings.push({id, date:todayISO(), title:'기획팀 주간회의', note:'', fileId:'', fileName:''});
  save(); rMeet();
}
async function delMeet(id){
  const m=MT(id);
  if(!confirm(`${fmtFull(m.date)} '${m.title}' 회의록을 삭제할까요?`)) return;
  if(m.fileId) await fileDel(m.fileId);
  DB.meetings=DB.meetings.filter(x=>x.id!==id); save(); rMeet();
}
let pdfTarget=null;
function pickPdf(mid){ pdfTarget=mid; document.getElementById('pdfFile').click(); }
async function pdfChosen(input){
  const f=input.files[0]; input.value='';
  if(!f || !pdfTarget) return;
  if(f.size > 25*1024*1024) return alert('25MB 이하의 PDF만 올릴 수 있습니다.');
  const m=MT(pdfTarget); pdfTarget=null;
  if(!m) return;
  try{
    const fid='f'+(++DB.seqF);
    await filePut(fid, f);
    if(m.fileId) await fileDel(m.fileId);
    m.fileId=fid; m.fileName=f.name;
    save(); rMeet(); toast('회의록 PDF가 저장되었습니다');
  }catch(e){ alert('파일 저장에 실패했습니다: '+e); }
}
async function openPdf(mid){
  const m=MT(mid); if(!m||!m.fileId) return;
  const w=window.open('about:blank');
  try{
    const blob=await fileGet(m.fileId);
    if(!blob){ w.close(); return toast('이 브라우저에 파일이 없습니다 (올린 컴퓨터에서만 열 수 있어요)'); }
    w.location = URL.createObjectURL(blob);
  }catch(e){ w.close(); toast('파일을 여는 데 실패했습니다'); }
}
async function removePdf(mid){
  const m=MT(mid);
  if(!confirm(`'${m.fileName}' 파일을 제거할까요? (회의록 항목은 유지됩니다)`)) return;
  await fileDel(m.fileId);
  m.fileId=''; m.fileName=''; save(); rMeet();
}

/* ═══════════════ 연간 캘린더 (월간 달력) ═══════════════ */
let calY=new Date().getFullYear(), calM=new Date().getMonth()+1;
let dayISO=null;
const DOW=['일','월','화','수','목','금','토'];

function calData(){
  const map={};
  const g=iso=>(map[iso]=map[iso]||{evs:[],dues:[]});
  DB.events.forEach(ev=>{ if(ev.date) g(ev.date).evs.push(ev); });
  openProjects().forEach(p=>{ if(p.due) g(p.due).dues.push(p); });
  return map;
}
function calShift(n){ calM+=n; if(calM<1){calM=12;calY--;} if(calM>12){calM=1;calY++;} closeDay(); rCal(); }
function calToday(){ const d=new Date(); calY=d.getFullYear(); calM=d.getMonth()+1; closeDay(); rCal(); }

function rCal(){
  const today=todayISO(), map=calData();
  const first=new Date(calY, calM-1, 1);
  const off=first.getDay(), dim=new Date(calY, calM, 0).getDate();
  const weeks=Math.ceil((off+dim)/7);
  const cur=new Date(first); cur.setDate(1-off);
  let cells='';
  for(let i=0;i<weeks*7;i++){
    const iso=dISO(cur), inM=cur.getMonth()===calM-1;
    const it=map[iso]||{evs:[],dues:[]};
    const chips=[
      ...it.dues.map(p=>`<div class="ev due ${p.due<today?'late':''}">${esc(p.name)}</div>`),
      ...it.evs.map(ev=>`<div class="ev plain">${esc(ev.title)}</div>`)
    ];
    const shown=chips.slice(0,3).join('') + (chips.length>3?`<div class="ev more">+${chips.length-3}</div>`:'');
    const dow=cur.getDay();
    cells+=`<div class="cal-cell ${inM?'':'out'} ${iso===today?'today':''}" onclick="openDay(event,'${iso}')">
      <div class="dnum ${dow===0?'sun':dow===6?'sat':''}">${cur.getDate()}</div>${shown}</div>`;
    cur.setDate(cur.getDate()+1);
  }
  document.getElementById('tab-cal').innerHTML=`
  <div class="cal-head">
    <button class="cal-nav" onclick="calShift(-1)">◀</button>
    <span class="ttl">${calY}년 ${calM}월</span>
    <button class="cal-nav" onclick="calShift(1)">▶</button>
    <button class="mini-btn gray" onclick="calToday()">오늘</button>
    <span style="flex:1"></span>
    <span class="muted"><span class="ev due" style="margin-right:4px">프로젝트 마감 (자동)</span><span class="ev plain">일정</span></span>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <div class="calgrid">
      ${DOW.map((d,i)=>`<div class="dow" style="${i===0?'color:var(--red)':i===6?'color:var(--blue)':''}">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>
  <div class="muted">날짜를 클릭하면 일정을 추가·수정·삭제할 수 있습니다 · 프로젝트 탭에서 마감일을 입력하면 자동으로 표시됩니다</div>`;
}

/* 날짜 팝업 */
function openDay(e, iso){
  e.stopPropagation();
  dayISO=iso;
  const pop=document.getElementById('dayPop');
  renderDayPop();
  pop.style.display='block';
  const r=e.currentTarget.getBoundingClientRect();
  let x=r.left, y=r.bottom+4;
  if(x+pop.offsetWidth>innerWidth-10) x=innerWidth-pop.offsetWidth-10;
  if(y+pop.offsetHeight>innerHeight-10) y=r.top-pop.offsetHeight-4;
  pop.style.left=Math.max(8,x)+'px'; pop.style.top=Math.max(8,y)+'px';
  pop.querySelector('.dp-new input').focus();
}
function renderDayPop(){
  const pop=document.getElementById('dayPop');
  const map=calData(), it=map[dayISO]||{evs:[],dues:[]};
  pop.innerHTML=`
    <div class="dp-title">${fmtFull(dayISO)}</div>
    ${it.dues.map(p=>`<div class="dp-due" onclick="closeDay();openProj('${p.id}')">
      마감 · ${esc(p.name)} <span class="muted">${esc(p.owners.join(', ')||'미정')}</span></div>`).join('')}
    ${it.evs.map(ev=>`<div class="dp-ev">
      <span ${ce(`upEvent('${ev.id}',this.innerText)`,'일정')}>${esc(ev.title)}</span>
      <button class="icon-btn" onclick="delEvent('${ev.id}')">✕</button></div>`).join('')}
    ${(!it.dues.length && !it.evs.length)?'<div class="muted" style="padding:2px 0 4px">등록된 일정이 없습니다</div>':''}
    <div class="dp-new">
      <input type="text" placeholder="새 일정 입력 후 Enter" onkeydown="if(event.key==='Enter')addEvent(this)">
      <button class="mini-btn" onclick="addEvent(this.previousElementSibling)">추가</button>
    </div>`;
}
function addEvent(inp){
  const v=inp.value.trim(); if(!v) return;
  DB.events.push({id:'E'+(++DB.seqE), date:dayISO, title:v});
  inp.value=''; save(); renderDayPop(); rCal();
  document.getElementById('dayPop').querySelector('.dp-new input').focus();
}
function upEvent(id,v){
  const ev=DB.events.find(e=>e.id===id); if(!ev) return;
  v=v.trim();
  if(!v) return renderDayPop();
  ev.title=v; save(); renderDayPop(); rCal();
}
function delEvent(id){
  DB.events=DB.events.filter(e=>e.id!==id);
  save(); renderDayPop(); rCal();
}
function closeDay(){
  const pop=document.getElementById('dayPop');
  if(pop.style.display==='none') return;
  pop.style.display='none'; dayISO=null;
}
document.addEventListener('click', e=>{
  const pop=document.getElementById('dayPop');
  if(pop.style.display!=='none' && !pop.contains(e.target)) closeDay();
});

/* ═══════════════ 운영 문서 ═══════════════ */
function rSop(){
  document.getElementById('tab-sop').innerHTML=`
  <div class="toolbar">

    <span class="muted">센터 운영의 기준 문서 목록 · 링크 칸에 구글독스/드라이브 URL을 붙여넣으세요</span>
  </div>
  <div class="card" style="padding:0"><div class="tbl-wrap">
  <table>

    ${DB.sops.map((s,i)=>`<tr>
      <td style="font-weight:600" ${ce(`upSop(${i},'doc',this.innerText)`,'문서명')}>${esc(s.doc)}</td>

      <td>${/^https?:\/\//.test(s.link)?`<a href="${esc(s.link)}" target="_blank" rel="noopener">열기 ↗</a>`:''}</td>
      <td><button class="icon-btn" onclick="if(confirm('삭제할까요?')){DB.sops.splice(${i},1);save();rSop()}">🗑</button></td>
    </tr>`).join('')}
  </table>
  </div></div>`;
}
function upSop(i,k,v){ DB.sops[i][k]=v.trim(); save(); rSop(); }

/* ═══════════════ 내보내기 / 가져오기 ═══════════════ */
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='foxcenter-data-'+todayISO().replace(/-/g,'')+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('데이터 파일을 내려받았습니다 — 팀에 공유하세요');
}
function importJSON(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      if(!Array.isArray(data.projects)) throw new Error('형식 오류');
      if(!confirm('현재 데이터를 가져온 파일로 교체합니다. 계속할까요?')) return;
      DB=data; const d=defaults();
      for(const k in d) if(DB[k]===undefined) DB[k]=d[k];
      save(); render(); toast('데이터를 불러왔습니다');
    }catch(e){ alert('올바른 데이터 파일이 아닙니다: '+e.message); }
    input.value='';
  };
  rd.readAsText(f);
}
function resetAll(){
  if(!confirm('모든 데이터를 삭제하고 초기 예시로 되돌립니다.\n⚠ 팀 공유 저장소도 함께 초기화되어 모든 팀원에게 적용됩니다.\n정말 초기화할까요?')) return;
  if(!confirm('마지막 확인 — 되돌릴 수 없습니다. 초기화할까요?\n(필요하면 먼저 내보내기로 백업하세요)')) return;
  localStorage.removeItem(LS_KEY); DB=defaults(); save(); render(); toast('초기화되었습니다');
}
