<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폭스러닝센터 · 학생성장관리</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2074%2074'%3E%3Cpath%20fill='%2372c0a1'%20d='M53%2052%2071%2072%2046%2065z'/%3E%3Ccircle%20cx='37'%20cy='37'%20r='37'%20fill='%2372c0a1'/%3E%3Cpath%20fill='%23fff'%20d='M21%2019%2037%2031%2053%2019%2053%2047%2037%2060%2021%2047z'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2074%2074'%3E%3Crect%20width='74'%20height='74'%20rx='16'%20fill='%23ffffff'/%3E%3Cg%20transform='translate(9%209)%20scale(0.76)'%3E%3Cpath%20fill='%2372c0a1'%20d='M53%2052%2071%2072%2046%2065z'/%3E%3Ccircle%20cx='37'%20cy='37'%20r='37'%20fill='%2372c0a1'/%3E%3Cpath%20fill='%23fff'%20d='M21%2019%2037%2031%2053%2019%2053%2047%2037%2060%2021%2047z'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#72c0a1">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --line:#e6e8ec; --line2:#eef0f3;
  --ink:#1e2530; --ink2:#5b6472; --ink3:#8a93a1;
  --accent:#2e7d59; --accent-soft:#e7f2ec; --accent-ink:#1f5c40;
  --warn:#c2410c; --info:#2563a8; --info-soft:#e8f0f9;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,45,.05),0 6px 20px rgba(20,30,45,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d3d8de;border-radius:6px;border:2px solid var(--bg)}

header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(6px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;height:58px}
.brand{cursor:pointer;display:flex;flex-direction:column;gap:2px;justify-content:center}
.brand .logo{height:26px;width:auto;display:block}
.brand small{display:block;font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap;letter-spacing:-.01em}
nav.tabs{display:flex;gap:2px}
nav.tabs button{border:0;background:transparent;color:var(--ink2);padding:8px 13px;border-radius:9px;font-weight:600;font-size:13.5px}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent-ink)}
nav.tabs button:hover:not(.on){background:var(--line2);color:var(--ink)}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#cbd2da}
.dot.ok{background:var(--accent)}.dot.warn{background:var(--warn)}.dot.load{background:var(--info);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.me{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;background:#fff}
.me select{border:0;background:transparent;font-weight:600;outline:none;max-width:110px}
.me .role{font-size:11px;color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:20px;font-weight:700}

main{max-width:1240px;margin:0 auto;padding:22px 20px 90px}
.view{display:none}.view.on{display:block;animation:fade .22s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
h2.title{font-size:23px;font-weight:800;letter-spacing:-.025em;margin:0 0 4px}
.sub{color:var(--ink3);font-size:13px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.sec-h{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.04em;margin:0 0 11px;display:flex;align-items:center;gap:8px}
.sec-h .act{margin-left:auto}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px}
.search input{border:0;outline:none;flex:1;background:transparent}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:12.5px;color:var(--ink2);font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-ink)}

/* student grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.scard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);display:flex;gap:12px}
.scard:hover{border-color:#cfd6dd;transform:translateY(-2px)}
.avatar{width:44px;height:44px;border-radius:12px;flex:0 0 44px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:72px;height:72px;flex-basis:72px;border-radius:16px;font-size:26px}
.scard .nm{font-weight:800;font-size:15.5px;letter-spacing:-.02em}
.scard .meta{font-size:11.5px;color:var(--ink3)}
.labtags{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 0}
.lt{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--line2);color:var(--ink2);font-weight:600}
.gchip{font-size:11px;padding:3px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.gchip.empty{background:#f3f4f6;color:var(--ink3);font-weight:600}
.scard .foot{display:flex;gap:10px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line2);font-size:11px;color:var(--ink3)}
.scard .foot b{color:var(--ink2)}

/* student page */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--ink3)}
.crumb a{color:var(--accent-ink);font-weight:700;text-decoration:none;cursor:pointer}
.phead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.phead .pnm{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.phead .pinfo{font-size:13px;color:var(--ink2);margin-top:3px}
.phead .pinfo b{color:var(--ink)}
.pstats{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--ink3)}
.pcols{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-top:16px;align-items:start}
@media(max-width:900px){.pcols{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:78px 1fr;gap:5px 10px;font-size:12.5px}
.kv dt{color:var(--ink3);font-weight:700}
.kv dd{margin:0;color:var(--ink)}
.dfield{margin-bottom:9px}
.dfield label{font-size:11px;color:var(--ink3);font-weight:700}
.dfield textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:3px;resize:vertical}
.goal-item{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;background:#fff}
.goal-item .gt{font-weight:700;font-size:13.5px}
.goal-item .gc{font-size:11px;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:6px;font-weight:700;margin-left:6px}
.status-pills{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.sp{font-size:11px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-weight:600;cursor:pointer}
.sp.on{color:#fff;border-color:transparent}
.sp.on[data-s="clear"]{background:var(--accent)}.sp.on[data-s="partial"]{background:#c99a06}.sp.on[data-s="none"]{background:#9aa3af}.sp.on[data-s="support"]{background:var(--warn)}

.trend{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.metric{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.metric .mv{font-size:20px;font-weight:800;letter-spacing:-.02em}
.metric .ml{font-size:11px;color:var(--ink3)}
.spark{display:flex;align-items:flex-end;gap:2px;height:24px;margin-top:6px}
.spark i{flex:1;background:var(--accent-soft);border-radius:2px 2px 0 0;min-height:2px}

/* records */
.rtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.rtabs button{border:0;background:transparent;padding:9px 14px;font-weight:700;font-size:13.5px;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.rtabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.rec{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:#fff}
.rec.emo{background:#fbfcfe}
.rhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.rdate{font-weight:800;font-size:13px}
.tb{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:700}
.tb.lab{background:var(--accent-soft);color:var(--accent-ink)}
.tb.emo{background:var(--info-soft);color:var(--info)}
.tb.g{background:var(--line2);color:var(--ink2)}
.tb.au{background:transparent;color:var(--ink3);font-weight:600}
.rtopic{font-weight:700;font-size:13px;margin-bottom:4px}
.rnote{white-space:pre-wrap;font-size:13.5px;line-height:1.6;margin-bottom:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px 12px;padding-top:8px;border-top:1px dashed var(--line)}
.fg{font-size:12px}.fg b{display:block;color:var(--ink3);font-weight:700;font-size:10.5px;margin-bottom:1px}
.fg span{white-space:pre-wrap}
.daygroup{margin-bottom:6px}
.dayhd{font-weight:800;font-size:12.5px;color:var(--ink2);background:var(--line2);padding:5px 11px;border-radius:8px;display:inline-block;margin:14px 0 8px}
.empty-note{color:var(--ink3);font-style:italic;font-size:12.5px}
.more{text-align:center;padding:10px}

.lib-goal{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:#fff}
.lib-goal .txt{flex:1;font-size:13px}
.lib-cat h4{margin:0 0 8px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.lib-cat h4 span{font-size:11px;color:var(--ink3);font-weight:600}

.warnbox{background:#fef6f0;border:1px solid #f2d5c2;color:#8a3b12;border-radius:10px;padding:10px 13px;font-size:12.5px;margin-bottom:12px}

.loader{text-align:center;padding:60px 20px;color:var(--ink3)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,28,40,.45);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:580px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(10,20,35,.3)}
.mbox .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800}
.mbox .mc{padding:18px 20px}
.mbox .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
label.fld{display:block;margin-bottom:12px}
label.fld .l{font-size:11.5px;color:var(--ink3);font-weight:700;margin-bottom:4px;display:block}
label.fld select,label.fld input,label.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* sub navigation inside student page */
.subnav{display:flex;gap:4px;margin:16px 0 4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow)}
.subnav button{flex:1;border:0;background:transparent;padding:10px 12px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.subnav button.on{background:var(--accent);color:#fff}
.subnav button:hover:not(.on){background:var(--line2)}
.stepnote{font-size:11.5px;color:var(--ink3);margin:6px 2px 14px}
/* AI paste + expert */
.bigbox{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.6;resize:vertical}
.stamp{font-size:11px;color:var(--ink3);margin-top:5px}
.expert{border:1px solid #cfe0d6;background:#f4faf7;border-radius:12px;padding:14px 16px}
.expert h4{margin:0 0 4px;font-size:13px;color:var(--accent-ink)}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-bottom:12px}
.flow b{background:var(--accent-soft);color:var(--accent-ink);padding:3px 9px;border-radius:20px;font-weight:700}
.flow b.done{background:var(--accent);color:#fff}
.repsec{position:relative}
.repopt{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px}
.repopt label{display:flex;align-items:center;gap:5px;cursor:pointer}
.skipprint{opacity:.45}
/* 연구소별 지표 요약 */
.ldig{border-bottom:1px solid var(--line2);padding:11px 0}
.ldig:first-child{padding-top:0}
.ldig:last-child{border-bottom:0;padding-bottom:0}
.ldig .lh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ldig .ln{font-weight:800;font-size:13.5px}
.ldig .lc{font-size:11.5px;color:var(--ink3);margin-left:auto}
.mbar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.mb{background:#f7f9fa;border:1px solid var(--line2);border-radius:8px;padding:6px 9px}
.mb b{font-size:16px;font-weight:800;display:block;line-height:1.15;letter-spacing:-.02em}
.mb span{font-size:10.5px;color:var(--ink3)}
.mb i{display:block;height:3px;border-radius:2px;background:var(--accent);margin-top:5px;opacity:.8}
.lmeta{font-size:11.5px;color:var(--ink2);margin-top:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.lmeta em{font-style:normal;color:var(--ink3)}
/* 리포트 지표 표 · 표현 점검 */
.rnote2{font-size:11px;color:var(--ink3);margin-top:4px}
.tonebox{background:#fef6f0;border:1px solid #f2d5c2;border-radius:11px;padding:12px 15px;margin-bottom:14px;font-size:12.5px;color:#8a3b12}
.tonebox b{display:block;margin-bottom:7px}
.tonehit{padding:4px 0;border-top:1px dashed #f2d5c2}
.tonehit .tw{background:#f6c7ab;color:#7a3410;border-radius:5px;padding:1px 6px;font-weight:700;font-size:11px}
.tonehit em{font-style:normal;color:#96603f}
.toneok{background:var(--accent-soft);color:var(--accent-ink);border-radius:11px;padding:9px 15px;margin-bottom:14px;font-size:12.5px;font-weight:600}
.nofield{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:#b08968}
.nofield em{font-style:normal;color:var(--ink3)}
/* ===== 성장리포트 (학부모 발송 문서) ===== */
.rep{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0;max-width:820px;margin:0 auto;color:#1e2530;box-shadow:var(--shadow)}
.rep *{box-sizing:border-box}

/* 표지 */
.rcover{background:linear-gradient(135deg,#f4faf7 0%,#eaf5ef 100%);border-bottom:3px solid #72c0a1;padding:30px 40px 26px;border-radius:12px 12px 0 0}
.rcover .rlogo{height:24px;width:auto;display:block;margin-bottom:20px}
.rcover .rtitle{font-size:12px;font-weight:800;letter-spacing:.14em;color:#4e8f74;margin-bottom:6px}
.rcover h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px;color:#203462;line-height:1.15}
.rcover .rperiod{font-size:14px;color:#4e8f74;font-weight:700}
.rcover .rfacts{display:flex;flex-wrap:wrap;gap:0 22px;margin-top:16px;padding-top:14px;border-top:1px solid #cfe3d8}
.rcover .rfacts div{font-size:12px;color:#5b6472}
.rcover .rfacts b{display:block;font-size:13px;color:#203462;font-weight:700;margin-top:1px}

.rbody{padding:6px 40px 40px}

/* 섹션 */
.rep section{padding-top:26px;page-break-inside:avoid}
.rep .sh{display:flex;align-items:baseline;gap:9px;border-bottom:2px solid #203462;padding-bottom:7px;margin-bottom:14px}
.rep .sn{font-size:11px;font-weight:800;color:#fff;background:#203462;width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 20px;align-self:center}
.rep .st{font-size:16px;font-weight:800;letter-spacing:-.02em;color:#203462}
.rep .ss{font-size:11.5px;color:#8a93a1;margin-left:auto;font-weight:600}
.rep p{margin:0 0 9px;white-space:pre-wrap;line-height:1.72;font-size:13.5px}
.rep p:last-child{margin-bottom:0}

/* 요약 통계 */
.rstats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:6px}
.rstat{background:#f7f9fa;border:1px solid var(--line2);border-radius:9px;padding:11px 8px;text-align:center}
.rstat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;color:#203462;line-height:1.1}
.rstat span{font-size:10.5px;color:#8a93a1;font-weight:600}

/* 강점 강조 (히어로) */
.rstrength{background:linear-gradient(135deg,#72c0a1 0%,#5aab8c 100%);border-radius:12px;padding:22px 26px;color:#fff}
.rstrength .sl{font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.85;margin-bottom:12px}
.rstrength .slist{display:flex;flex-wrap:wrap;gap:8px}
.rstrength .sitem{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 15px;font-size:14px;font-weight:700}
.rstrength .sitem em{font-style:normal;opacity:.75;font-weight:600;font-size:12px;margin-left:5px}
.rstrength .stop{background:#fff;color:#2b6b52;border-color:#fff}
.rstrength .snote{font-size:11.5px;opacity:.9;margin-top:12px;line-height:1.6}

/* 연구소 블록 */
.rlab{border:1px solid var(--line);border-radius:11px;padding:0;margin-bottom:12px;overflow:hidden;page-break-inside:avoid}
.rlab .lhd{background:#f7f9fa;border-bottom:1px solid var(--line);padding:10px 15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rlab .lnm{font-weight:800;font-size:14px;color:#203462}
.rlab .lct{font-size:11.5px;color:#8a93a1}
.rlab .lms{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
.rlab .lm{background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:11px;color:#5b6472;white-space:nowrap}
.rlab .lm b{color:#203462;font-weight:800;font-size:12.5px}
.rlab .lbd{padding:12px 15px}

<script>
/* ===================== CONFIG ===================== */
const OBS_ID='1Q1F7Hda6fglcwuvLKCP9S3Xf2PiwQHyp9p1iCekI2Mg';
const MEMBER_GID='0';
const OBS_TABS=[
  {lab:'SEL연구소',gid:'785835299'},{lab:'SEL센터',gid:'282201074'},
  {lab:'언어연구소',gid:'841713854'},{lab:'미술연구소',gid:'1087530187'},
  {lab:'인공지능연구소',gid:'1845623131'},{lab:'수리연구소',gid:'1011123485'},
];
const EC_ID='17JJYwp1rHUSf2j7DXI2wKC84hXJ2ghOPDZdmQALeyo0';
const EC_IN='1195490555', EC_OUT='350795427';
const NPOINT='https://api.npoint.io/240a1e52df2a7cf131dd';
const YEAR=2026;

/* ===================== STATE ===================== */
const RAW={obs:[],emo:[],members:{}};
let DB={students:{},goalAssignments:{},diagnosis:{},aiAnalysis:{},expert:{},reports:{},goalLibrary:null,staff:null,updatedAt:0};
let STUDENTS=[], labFilterSet=new Set(), curStudent=null, recTab='obs', recLab='', recLimit=30;
let subTab='records', repQ=0, lastSheetSync=0;
let sortMode='name';   // name | recent (실제 값은 boot()에서 복원)
let actFilter='';   // '' | regular | occasional | dormant

/* ===================== UTIL ===================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const trim=s=>(s==null?'':String(s)).trim();
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}

/* gviz JSONP (fetch is CORS-blocked for sheets) */
function jsonp(id,gid){return new Promise((res,rej)=>{
  const cb='__gv'+Math.random().toString(36).slice(2);
  const s=document.createElement('script');
  const done=()=>{try{delete window[cb];}catch(e){}s.remove();};
  window[cb]=d=>{done();res(d);};
  s.onerror=()=>{done();rej(new Error('script error'));};
  s.src=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?gid=${gid}&tqx=responseHandler:${cb}&_=${Date.now()}`;
  document.head.appendChild(s);
  setTimeout(()=>{if(window[cb]){done();rej(new Error('timeout'));}},15000);
});}
// normalizes gviz cells. Date(y,m,d) -> "YYYY-MM-DD";
// time-of-day cells (Date with h:m:s, or [h,m,s]) keep the sheet's formatted text.
const pad2=n=>String(n).padStart(2,'0');
function cellVal(cell){
  if(cell==null)return '';
  const f=trim(cell.f), v=cell.v;
  if(v==null)return f;
  if(Array.isArray(v))return f||`${pad2(v[0]??0)}:${pad2(v[1]??0)}`;      // timeofday
  if(typeof v==='string'){
    const m=v.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/);
    if(m){
      const hasTime=m[4]!=null&&!(m[4]==='0'&&m[5]==='0');
      if(hasTime||+m[1]<1900)return f||`${pad2(+m[4]||0)}:${pad2(+m[5]||0)}`;
      return `${m[1]}-${pad2(+m[2]+1)}-${pad2(+m[3])}`;
    }
    return v;
  }
  if(v instanceof Date){
    if(v.getFullYear()<1900)return f||`${pad2(v.getHours())}:${pad2(v.getMinutes())}`;
    return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  }
  return String(v);
}
async function fetchTable(id,gid){
  const d=await jsonp(id,gid);
  if(!d||!d.table)throw new Error('no table');
  const cols=d.table.cols.map(c=>trim(c.label));
  const rows=d.table.rows.map(r=>(r.c||[]).map(cellVal));
  return {cols,rows};
}
function parseKDate(s){
  s=trim(s);if(!s)return null;
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);       if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);      if(m)return new Date(YEAR,+m[1]-1,+m[2]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})/);                if(m)return new Date(YEAR,+m[1]-1,+m[2]);
  m=s.match(/^(\d{2})\.(\d{1,2})\.(\d{1,2})/);       if(m)return new Date(2000+ +m[1],+m[2]-1,+m[3]);
  return null;
}
const fmtDate=d=>d?`${d.getFullYear()!==YEAR?d.getFullYear()+'년 ':''}${d.getMonth()+1}월 ${d.getDate()}일`:'날짜 미상';
const dayName=d=>d?'일월화수목금토'[d.getDay()]:'';
const quarterOf=d=>d?Math.floor(d.getMonth()/3)+1:0;
const gradeNum=s=>{const m=trim(s).match(/^([1-5])/);return m?+m[1]:null;};
const initials=n=>trim(n).replace(/\(.*\)/,'').slice(-2);

/* ===================== LOAD SHEETS ===================== */
async function loadMembers(){
  try{
    const {cols,rows}=await fetchTable(OBS_ID,MEMBER_GID);
    const ci=n=>cols.findIndex(h=>h.replace(/\s/g,'').includes(n));
    const c={type:0,name:ci('이름'),birth:ci('생년월일'),age:ci('나이/학년'),school:ci('학교명'),start:ci('구독시작'),end:ci('구독종료'),ride:ci('등하원'),proj:ci('참여프로젝트')};
    const map={};
    rows.forEach(r=>{const nm=trim(r[c.name]);if(!nm)return;
      map[nm]={membership:trim(r[c.type]),birth:trim(r[c.birth]),age:trim(r[c.age]),school:trim(r[c.school]),
        start:trim(r[c.start]),end:trim(r[c.end]),ride:trim(r[c.ride]),project:trim(r[c.proj])};});
    RAW.members=map;
  }catch(e){console.warn('member_db',e);}
}
// keep EVERY column so nothing is hidden
function packFields(cols,row,skipIdx){
  const out=[];
  cols.forEach((label,i)=>{if(skipIdx.has(i))return;const v=trim(row[i]);if(!v||!label)return;out.push([label,v]);});
  return out;
}
async function loadObservations(){
  const out=[];
  await Promise.all(OBS_TABS.map(async t=>{
    try{
      const {cols,rows}=await fetchTable(OBS_ID,t.gid);
      const ci=n=>cols.findIndex(h=>h.replace(/\s/g,'').includes(n));
      const c={name:ci('이름'),kind:ci('구분'),start:ci('활동시작'),end:ci('활동끝'),author:ci('작성자'),
               prog:ci('프로그램명'),topic:ci('주제'),note:ci('활동관찰내용')};
      const skip=new Set([0,c.name,c.kind,c.start,c.end,c.author,c.prog,c.topic,c.note].filter(i=>i>=0));
      rows.forEach(r=>{
        const name=trim(r[c.name]);if(!name)return;
        const fields=packFields(cols,r,skip);
        const note=trim(r[c.note]),topic=trim(r[c.topic]);
        if(!note&&!topic&&!fields.length)return;
        out.push({type:'obs',lab:t.lab,name,date:parseKDate(r[0]),dateRaw:trim(r[0]),
          kind:trim(r[c.kind]),author:trim(r[c.author]),program:trim(r[c.prog]),
          time:[trim(r[c.start]),trim(r[c.end])].filter(Boolean).join('~'),
          topic,note,fields});
      });
    }catch(e){console.warn('obs',t.lab,e);}
  }));
  RAW.obs=out;
}
async function loadEmotions(){
  const out=[];
  const grab=async(gid,io)=>{
    const {cols,rows}=await fetchTable(EC_ID,gid);
    const ci=n=>cols.findIndex(h=>h.replace(/\s/g,'').includes(n));
    const c={date:ci('날짜'),name:ci('이름'),io:ci('입실/퇴실'),emo:ci('감정')};
    const skip=new Set([c.date,c.name,c.io].filter(i=>i>=0));
    rows.forEach(r=>{
      const name=trim(r[c.name]);if(!name)return;
      if(io==='입실'&&c.io>=0){const v=trim(r[c.io]);if(v&&v!=='입실')return;}
      const fields=packFields(cols,r,skip);
      if(!fields.length)return;
      out.push({type:'emo',io,name,date:parseKDate(r[c.date]),dateRaw:trim(r[c.date]),
        emotion:trim(r[c.emo]),fields,
        _energy:gradeNum(r[ci('에너지')]),_focus:gradeNum(r[ci('집중도')]),_relation:gradeNum(r[ci('친구들과의관계')])});
    });
  };
  try{await grab(EC_IN,'입실');}catch(e){console.warn('emo in',e);}
  try{await grab(EC_OUT,'퇴실');}catch(e){console.warn('emo out',e);}
  RAW.emo=out;
}
function buildStudents(){
  const m=new Map();
  const touch=n=>{if(!m.has(n))m.set(n,{labs:new Set(),obsN:0,emoN:0,last:null});return m.get(n);};
  RAW.obs.forEach(o=>{const s=touch(o.name);s.labs.add(o.lab);s.obsN++;if(o.date&&(!s.last||o.date>s.last))s.last=o.date;});
  RAW.emo.forEach(e=>{const s=touch(e.name);s.emoN++;if(e.date&&(!s.last||e.date>s.last))s.last=e.date;});
  STUDENTS=[...m.entries()].map(([name,v])=>({name,labs:[...v.labs],obsN:v.obsN,emoN:v.emoN,last:v.last,
    member:RAW.members[name]||null})).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
}
const recordsFor=n=>{
  const obs=RAW.obs.filter(o=>o.name===n).sort((a,b)=>(b.date?.getTime()||0)-(a.date?.getTime()||0));
  const emo=RAW.emo.filter(e=>e.name===n).sort((a,b)=>(b.date?.getTime()||0)-(a.date?.getTime()||0));
  return {obs,emo,all:[...obs,...emo].sort((a,b)=>(b.date?.getTime()||0)-(a.date?.getTime()||0))};
};

/* ===================== SYNC ===================== */
/* ===== 학생 사진 =====
   파일을 업로드하면 브라우저에서 작게 줄여(150px JPEG) 별도 공유 저장소에 보관한다.
   메인 DB(8초 폴링)와 분리해 동기화를 무겁게 하지 않는다. */
const NPOINT_PHOTOS='https://api.npoint.io/5b6d74031b7c97370723';
const PKEY='foxgrowth.photos.v1';
let PHOTOS={};
function loadPhotoCache(){try{const c=JSON.parse(lsGet(PKEY));if(c&&typeof c==='object')PHOTOS=c;}catch(e){}}
function savePhotoCache(){lsSet(PKEY,JSON.stringify(PHOTOS));}
async function loadPhotos(){
  try{const r=await fetch(NPOINT_PHOTOS+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;const d=await r.json();
    if(d&&d.photos&&typeof d.photos==='object'){PHOTOS=d.photos;savePhotoCache();}
  }catch(e){console.warn('photos load',e);}
}
async function pushPhotos(){
  const body=JSON.stringify({photos:PHOTOS,updatedAt:Date.now()});
  const kb=Math.round(body.length/1024);

  if(!r.ok)throw new Error('저장 실패 ('+kb+'KB)');
  savePhotoCache();return kb;
}
// 파일 → 정사각 썸네일 data URI (가운데 잘라내기)
function fileToThumb(file,size,q){
  size=size||150;q=q||0.72;
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type))return rej(new Error('이미지 파일이 아닙니다'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('파일을 읽지 못했습니다'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('이미지를 열지 못했습니다'));
      img.onload=()=>{
        const s=Math.min(img.width,img.height);
        const sx=(img.width-s)/2, sy=(img.height-s)/2;
        const c=document.createElement('canvas');c.width=c.height=size;
        const x=c.getContext('2d');
        x.fillStyle='#fff';x.fillRect(0,0,size,size);
        x.drawImage(img,sx,sy,s,s,0,0,size,size);
        res(c.toDataURL('image/jpeg',q));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

window.bulkPhotos=async input=>{
  const files=[...(input.files||[])];if(!files.length)return;
  const names=new Set(STUDENTS.map(s=>s.name));
  let ok=0,skip=[],fail=[];
  const st=$('#bulkStat');

    const nm=f.name.replace(/\.[^.]+$/,'').trim();
    if(st)st.textContent=`처리 중 ${i+1}/${files.length} — ${nm}`;

      +(fail.length?`<br><span style="color:var(--warn)">처리 실패 ${fail.length}명: ${esc(fail.join(', '))}</span>`:'');
    renderSettings();toast(`${ok}명 사진 등록됨`);

/* ===== 대시보드 =====
   학생을 등급화하지 않는다. 지표 변화는 근거(척도 4건 이상)가 있을 때만 표시하고,
   나머지는 '데이터 부족'으로 둔다. 우선순위는 아이가 아니라 '직원이 할 일'로 매긴다. */
const SCALE_MIN=4, STALE_DAYS=14;
function scaleOf(o){return scale5(fieldOf(o,'활동집중도'))||scale5(fieldOf(o,'또래상호작용'))||COMPLY[trim(fieldOf(o,'규칙과연구원의안내수용도'))];}
// 전반 → 후반 지표 변화 (buildReport의 cmp와 같은 원리)
function trendOf(name){
  const {obs}=recordsFor(name);
  const dd=obs.filter(o=>o.date).sort((a,b)=>a.date-b.date);
  const scored=dd.filter(scaleOf);
  if(scored.length<SCALE_MIN)return {ok:false,n:scored.length};
  const t0=dd[0].date.getTime(), t1=dd[dd.length-1].date.getTime(), mid=t0+(t1-t0)/2;
  const h1=dd.filter(o=>o.date.getTime()<=mid), h2=dd.filter(o=>o.date.getTime()>mid);
  if(!h1.length||!h2.length)return {ok:false,n:scored.length};
  const m=a=>{const v=a.map(o=>scale5(fieldOf(o,'활동집중도'))).filter(Boolean);
    return v.length?v.reduce((x,y)=>x+y,0)/v.length:null;};
  const a=m(h1), b=m(h2);
  if(a==null||b==null)return {ok:false,n:scored.length};
  const d=b-a;
  return {ok:true,n:scored.length,delta:d,dir:d>0.2?'up':d<-0.2?'down':'flat',a:a.toFixed(1),b:b.toFixed(1)};
}
/* 활동 상태: 최근 8주 중 기록이 있는 주 수로 판단.
   센터를 그만뒀거나 주 1회 한 연구소만 오는 학생이 많아, 데이터가 적은 것은
   문제가 아니라 참여 형태다. 따라서 '조치 필요'로 분리하지 않고 상태로만 구분한다. */
const ACT_WEEKS=8;
function activityOf(s){
  const {obs,emo}=recordsFor(s.name);
  const now=Date.now(), W=604800000;
  const wk=new Set([...obs,...emo].filter(x=>x.date&&now-x.date<ACT_WEEKS*W).map(x=>Math.floor(x.date/W)));
  const n=wk.size;
  const k=n===0?'dormant':n>=6?'regular':'occasional';
  return {weeks:n,k,label:k==='regular'?'정기 활동':k==='occasional'?'간헐 활동':'활동 없음'};
}
function studentSignals(s){
  const {obs,emo}=recordsFor(s.name);
  const goals=DB.goalAssignments[s.name]||[];
  const rep=DB.reports[s.name]||{};
  const days=s.last?Math.floor((Date.now()-s.last)/86400000):null;
  const scored=obs.filter(scaleOf).length;
  const act=activityOf(s);
  // 다음 단계 제안은 '기록이 충분히 쌓인 학생'에게만 의미가 있다
  const ready=act.k!=='dormant'&&obs.length>=10;
  const next=ready&&!goals.length?{k:'goal',t:'성장목표 설정 가능'}
    :goals.length&&!Object.keys(rep).length?{k:'report',t:'리포트 작성 가능'}:null;
  return {obs,emo,goals,days,scored,act,ready,next,trend:trendOf(s.name)};
}
let DASH=null;

  const rows=STUDENTS.map(s=>({s,...studentSignals(s)}));
  const tr=rows.filter(r=>r.trend.ok);
  DASH={
    rows,
    total:STUDENTS.length,
    withGoal:rows.filter(r=>r.goals.length).length,

    trendable:tr.length,
    up:tr.filter(r=>r.trend.dir==='up').length,
    flat:tr.filter(r=>r.trend.dir==='flat').length,
    down:tr.filter(r=>r.trend.dir==='down').length,
    noData:rows.filter(r=>!r.trend.ok).length,
    obsTotal:RAW.obs.length, emoTotal:RAW.emo.length,
    reports:rows.filter(r=>Object.keys(DB.reports[r.s.name]||{}).length).length,
    findings:rows.filter(r=>{const q=DB.reports[r.s.name]||{};return Object.values(q).some(x=>x&&x.discovery);}).length,
    expert:Object.keys(DB.expert||{}).length,
    regular:rows.filter(r=>r.act.k==='regular').length,
    occasional:rows.filter(r=>r.act.k==='occasional').length,
    dormant:rows.filter(r=>r.act.k==='dormant').length,
    next:rows.filter(r=>r.next).sort((a,b)=>b.obs.length-a.obs.length),
    recent:rows.filter(r=>r.s.last).sort((a,b)=>b.s.last-a.s.last).slice(0,8)
  };
  return DASH;
}

/* ---- 연구소별 지표 집계 ----
   시트 값이 "3. 기본적인 집중 유지" 형태라 앞 숫자만 취한다.
   열 밀림으로 "13:00","스페셜" 같은 값이 섞여 있어 척도 밖 값은 버린다. */
const COMPLY={'지속적인 개입 필요':1,'반복적인 안내 필요':2,'기본적인 조절 가능':3,'대부분 스스로 조절하며 잘 따름':4};
function scale5(v){const m=trim(v).match(/^([1-5])\./);return m?+m[1]:null;}
function fieldOf(o,key){const f=o.fields.find(([k])=>k.replace(/\s/g,'').includes(key));return f?f[1]:'';}
function avgOf(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;}
function metricBox(label,val,max,n){
  if(val==null)return `<div class="mb"><b style="color:var(--ink3)">-</b><span>${label}</span></div>`;
  return `<div class="mb"><b>${val.toFixed(1)}</b><span>${label} <em style="color:var(--ink3)">n=${n}</em></span>
    <i style="width:${Math.round(val/max*100)}%"></i></div>`;
}
function renderLabDigest(obs){
  const byLab={};obs.forEach(o=>{(byLab[o.lab]=byLab[o.lab]||[]).push(o);});
  if(!Object.keys(byLab).length)return '<div class="empty-note">관찰 없음</div>';
  return Object.entries(byLab).sort((a,b)=>b[1].length-a[1].length).map(([lab,a])=>{
    const focus=a.map(o=>scale5(fieldOf(o,'활동집중도'))).filter(Boolean);
    const peer =a.map(o=>scale5(fieldOf(o,'또래상호작용'))).filter(Boolean);
    const comply=a.map(o=>COMPLY[trim(fieldOf(o,'규칙과연구원의안내수용도'))]).filter(Boolean);
    // 어려운 상황
    const hardVals=a.map(o=>trim(fieldOf(o,'어려운상황이있었는가'))).filter(v=>v==='있음'||v==='없음');
    const hardN=hardVals.filter(v=>v==='있음').length;
    const hardTypes={};
    a.forEach(o=>{const t=trim(o.fields.filter(([k])=>k.includes('(있음)')).map(([,v])=>v)[0]||'');if(t)hardTypes[t]=(hardTypes[t]||0)+1;});
    const topHard=Object.entries(hardTypes).sort((x,y)=>y[1]-x[1]).slice(0,2).map(([k,v])=>`${k} ${v}`).join(' · ');
    // 강점 빈도 (쉼표/슬래시로 여러 개 기재됨)
    const st={};
    a.forEach(o=>{const s=fieldOf(o,'강점또는돋보인모습');if(!s)return;
      s.split(/[,/·]/).map(x=>trim(x)).filter(Boolean).forEach(x=>st[x]=(st[x]||0)+1);});
    const topSt=Object.entries(st).sort((x,y)=>y[1]-x[1]).slice(0,3);
    // 기간
    const ds=a.filter(o=>o.date).map(o=>o.date).sort((x,y)=>x-y);
    const noted=a.filter(o=>o.note).length;
    const hasMetric=focus.length||peer.length||comply.length;
    return `<div class="ldig">
      <div class="lh"><span class="ln">${esc(lab)}</span>
        <span class="lc">${a.length}건${noted<a.length?` <em style="color:var(--ink3)">(내용 ${noted})</em>`:''}${ds.length?` · ${fmtDate(ds[0])}~${fmtDate(ds[ds.length-1])}`:''}</span></div>
      ${hasMetric?`<div class="mbar">
        ${metricBox('집중도',avgOf(focus),5,focus.length)}
        ${metricBox('또래',avgOf(peer),5,peer.length)}
        ${metricBox('수용도',avgOf(comply),4,comply.length)}
      </div>`:'<div class="lmeta"><em>척도 지표 기록 없음</em></div>'}
      ${hardVals.length?`<div class="lmeta">어려운 상황 <b>${hardN}/${hardVals.length}</b> (${Math.round(hardN/hardVals.length*100)}%)${topHard?` <em>· ${esc(topHard)}</em>`:''}</div>`:''}
      ${topSt.length?`<div class="lmeta">강점 ${topSt.map(([k,v])=>`<span class="gchip" style="font-size:10.5px">${esc(k)} ${v}</span>`).join(' ')}</div>`:''}
    </div>`;
  }).join('');
}

      <div class="stamp">${ex.at?`확정: ${esc(ex.reviewer||'')} · ${new Date(ex.at).toLocaleString('ko-KR')}`:'아직 전문가 소견이 없습니다.'}</div>

/* AI 결과([머리말] 형식)를 리포트 각 칸으로 분배.
   내부 메모는 리포트에 넣지 않는다. */
function parseAISections(text){
  const out={};
  const re=/^\s*\[([^\]]+)\]\s*$/;
  let cur=null, buf=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    const m=line.match(re);
    if(m){ if(cur)out[cur]=buf.join('\n').trim(); cur=trim(m[1]); buf=[]; }
    else if(cur!==null) buf.push(line);
  });

const CAUTION=['산만','집중하지 못','집중력이 떨어','집중이 어려','지적','싫어','거부','못함','안함','힘들어','부족','떨어짐','방해','장난','짜증','다툼','싸움','혼남','poor','not focus','distract','refus','lazy','disrupt'];
function checkTone(){
  const host=$('#toneCheck');if(!host)return;
  const hits=[];
  $$('#repDoc [data-k]').forEach(el=>{
    if(el.closest('#secEvid'))return;      // 관찰 원문(내부용)만 점검 제외

      if(i<0)return;

   형식이 맞지 않으면 null을 돌려 기존 문단 표시로 폴백한다. */

function emoField(e,key){const f=e.fields.find(([k])=>k.replace(/\s/g,'').includes(key));return f?trim(f[1]):'';}
function emoTop(list,key,n){
  const c={};
  list.forEach(e=>{let v=emoField(e,key);if(!v)return;
    v=v.split('//')[0].trim();               // "설렘 // 오늘처럼 열심히 하기" → "설렘"

    c[v]=(c[v]||0)+1;});

function emoYes(list,key){

function emotionDigest(qEmo){

function renderAnalysisDoc(text){
  const src=trim(text); if(!src)return '';
  const lines=src.split(/\r?\n/);
  let html='', mode=null, buf=[], ba={before:[],after:[]};
  const esc2=s=>esc(s);
  const flush=()=>{
    if(mode==='evidence'&&buf.length){
      html+=`<div class="aEvid"><b>관찰 근거</b>${buf.map(l=>{
        const m=l.match(/^(\d{1,2}월\s*\d{1,2}일[^:：]*)[:：]\s*(.+)$/);
        return m?`<div class="ev"><span class="evd">${esc2(trim(m[1]))}</span>${esc2(trim(m[2]))}</div>`
                :`<div class="ev">${esc2(l)}</div>`;}).join('')}</div>`;
    } else if(mode==='interp'&&buf.length){
      html+=`<div class="aInterp"><b>해석</b><p>${esc2(buf.join(' '))}</p></div>`;
    } else if(mode==='note'&&buf.length){
      html+=`<div class="aNote"><b>${esc2(noteLabel)}</b><p>${esc2(buf.join(' '))}</p></div>`;
    } else if(buf.length){
      html+=buf.map(l=>`<p class="aP">${esc2(l)}</p>`).join('');
    }
    buf=[];
  };
  const flushBA=()=>{
    if(!ba.before.length&&!ba.after.length)return;
    const n=Math.max(ba.before.length,ba.after.length);
    const cell=l=>{if(!l)return '';const m=l.match(/^(\d{1,2}월\s*\d{1,2}일[^:：]*)[:：]\s*(.+)$/);
      return m?`<span class="evd">${esc2(trim(m[1]))}</span>${esc2(trim(m[2]))}`:esc2(l);};
    html+=`<div class="aBA"><table><thead><tr><th>Before <em>기간 초반</em></th><th>After <em>기간 후반</em></th></tr></thead><tbody>`;
    for(let i=0;i<n;i++)html+=`<tr><td>${cell(ba.before[i])}</td><td>${cell(ba.after[i])}</td></tr>`;
    html+=`</tbody></table></div>`;
    ba={before:[],after:[]};
  };
  let noteLabel='';
  lines.forEach(raw=>{
    const l=trim(raw);
    if(!l)return;
    let m;
    if((m=l.match(/^(\d+)\)\s*(.+)$/))){                    // 1) 대제목
      flush();flushBA();mode=null;
      html+=`<h4 class="aH1"><span>${m[1]}</span>${esc2(m[2])}</h4>`;return;}
    if((m=l.match(/^([①-⑳])\s*(.+)$/))){                    // ① 소제목
      flush();flushBA();mode=null;
      html+=`<div class="aH2"><i>${m[1]}</i>${esc2(m[2])}</div>`;return;}
    if((m=l.match(/^([A-Z])\.\s+(.+)$/))){                  // A. 소제목
      flush();flushBA();mode=null;
      html+=`<div class="aH2 alt"><i>${m[1]}</i>${esc2(m[2])}</div>`;return;}
    if(/^Before$/i.test(l)){flush();mode='before';return;}
    if(/^After$/i.test(l)){flush();mode='after';return;}
    if(/^(관찰 근거|선정 근거|근거)$/.test(l)){flush();flushBA();mode='evidence';return;}
    if(/^해석$/.test(l)){flush();flushBA();mode='interp';return;}
    if(/^(연구소 간 차이|현재 관찰 단계.*|SEL 전문 상담가.*|분석 핵심 요약)$/.test(l)){
      flush();flushBA();noteLabel=l;mode='note';return;}
    if(mode==='before'){ba.before.push(l);return;}
    if(mode==='after'){ba.after.push(l);return;}
    if(mode==='evidence'||mode==='interp'||mode==='note'){buf.push(l);return;}
    // 메타 줄 (관찰 기간: ... 형태)
    if(/^[^:：]{2,20}[:：]\s*.+$/.test(l)&&l.length<120&&!/[.!?]$/.test(l)){
      flush();html+=`<div class="aMeta">${esc2(l)}</div>`;return;}
    buf.push(l);
  });
  flush();flushBA();
  return html;
}
function parseFindings(text){
  const t=trim(text);if(!t)return null;
  const items=[];let cur=null;
  t.split(/\r?\n/).forEach(line=>{
    const raw=trim(line);
    if(!raw||/^-{3,}$/.test(raw)||/^[=_]{3,}$/.test(raw))return;   // 구분선은 불릿 제거 전에 걸러야 함
    const l=raw.replace(/^[-·•*]\s*/,'');
    if(!l||/^-{3,}$/.test(l))return;
    let m=l.match(/^발견\s*\d*\s*[:：]\s*(.+)$/);
    if(m){if(cur)items.push(cur);cur={title:trim(m[1]),evidence:'',possibility:''};return;}
    m=l.match(/^근거\s*[:：]\s*(.+)$/);
    if(m&&cur){cur.evidence=trim(m[1]);return;}
    m=l.match(/^가능성\s*[:：]\s*(.+)$/);
    if(m&&cur){cur.possibility=trim(m[1]);return;}
    if(cur){ // 이어지는 줄은 직전 항목에 붙임
      if(cur.possibility)cur.possibility+=' '+l;
      else if(cur.evidence)cur.evidence+=' '+l;
      else cur.title+=' '+l;
    }
  });
  if(cur)items.push(cur);
  const valid=items.filter(i=>i.title&&(i.evidence||i.possibility));
  return valid.length?valid:null;
}
function renderFindings(text){
  const f=parseFindings(text);
  if(!f)return null;

    ${x.possibility?`<div class="fr fp"><b>가능성</b><span>${esc(x.possibility)}</span></div>`:''}
  </div>`).join('')}</div>`;
}

function renderRecords(name){
  const {obs,emo,all}=recordsFor(name);

  if(!list.length)return '<div class="empty-note">기록이 없습니다.</div>';

  if(list.length>recLimit)html+=`<div class="more"><button class="btn sm" onclick="moreRecs()">더 보기 (${list.length-recLimit}건 남음)</button></div>`;
  else if(list.length>30)html+=`<div class="more"><span class="empty-note">전체 ${list.length}건 모두 표시됨</span></div>`;

■ FOX 학생 성장 프레임워크
FOX Student Growth Loop: 선별 → 관찰 → 발견 → 반응 → 성장
  · 관찰(Observation): 사실을 기록한다.
  · 발견(Discovery): 여러 관찰을 연결하여 가능성을 탐색한다.
  · 반응(Response): 발견을 교육적 행동으로 연결한다.
  · 성장(Growth): 반응 이후의 변화를 확인한다.
해석 원칙: 관찰 → 근거 → 해석 → 가능성 → 반응

■ 반드시 지켜야 할 원칙 ('가능성 발견' 원칙)
1. 학생을 섣불리 규정하거나 고정적인 라벨을 부여하지 않습니다.
   (X) "김폭스는 리더십이 뛰어난 학생이다."
   (O) "여러 활동에서 또래에게 먼저 의견을 제시하고 친구들의 참여를 이끄는 행동이 반복적으로 관찰되었습니다.
        이러한 모습은 향후 리더십 역량으로 발전할 가능성을 보여줍니다."
2. 모든 해석에는 실제 관찰 근거(날짜·연구소·구체적 장면)를 함께 제시합니다.
3. 당신은 학생을 직접 평가하거나 판단하지 않습니다. 패턴과 가능성을 '제안'할 뿐이며,
   최종 검토·수정·확정은 SEL 전문 상담가가 수행합니다.
4. 진단 결과는 학생을 규정하기 위한 것이 아니라, FOX가 무엇을 관찰하고 어떤 성장을 지원할지
   결정하기 위한 초기 기준점입니다.

■ 연구소 간 통합 원칙
연구소별 전문성은 유지하되, 학생의 성장은 연구소별로 분리해서 보지 않습니다.
언어(English)에서 관찰된 자기표현, 인공지능(AI)에서 관찰된 문제해결,
미술(Art)에서 관찰된 창의적 접근, SEL에서 관찰된 또래관계를
하나의 학생 데이터로 연결하여 학생 전체의 성장과 가능성을 파악하세요.

 변화를 확인하기에 근거가 부족하면 그렇게 밝히세요.)

[지원]
(2~3문장. 위 성장목표를 위해 센터가 활동 중에 실제로 어떻게 지원하고 있는지.
 연구원이 활동 안에서 바로 실행하는 방식으로 구체적으로.)

[다음 방향]
(2~3문장. 다음 분기에 센터가 집중할 성장 방향.
 필요하면 관찰 가능한 행동 형태의 성장목표 1~2개를 제안하세요.)

[가정 지원]
(2~3문장. 가정에서 부담 없이 함께 해볼 수 있는 구체적인 방법.
 훈육 지시가 아니라 제안의 어조로.)

[내부 메모]
(위와 분리된, 센터 내부용 메모입니다. 학부모에게 전달되지 않습니다.
 SEL 전문가가 확인해야 할 사항, 추가 관찰이 필요한 지점,
 상담가 개입이 필요해 보이는 근거를 솔직하게 적어 주세요.)`;
}
window.copyPrompt=()=>{const t=$('#aiPrompt');t.select();navigator.clipboard?.writeText(t.value).then(()=>toast('복사됨'),()=>{document.execCommand('copy');toast('복사됨');});};


/* ===================== LIBRARY / SETTINGS ===================== */
function renderLibrary(){
  $('#libBody').innerHTML=DB.goalLibrary.map((c,ci)=>`<div class="card pad lib-cat" style="margin-bottom:12px">
    <h4>${esc(c.cat)} <span>${c.goals.length}개</span>
      <button class="btn ghost sm" style="margin-left:auto" onclick="addGoalToCat(${ci})">+ 목표</button>
      <button class="btn ghost sm" onclick="delCat(${ci})">역량 삭제</button></h4>
    ${c.goals.map((g,gi)=>`<div class="lib-goal"><span class="txt" contenteditable="true" onblur="editGoalText(${ci},${gi},this.innerText)">${esc(g)}</span><button class="btn ghost sm" onclick="delGoal(${ci},${gi})">✕</button></div>`).join('')}</div>`).join('');
}
window.editGoalText=(c,g,t)=>{DB.goalLibrary[c].goals[g]=trim(t);commit();};
window.delGoal=(c,g)=>{DB.goalLibrary[c].goals.splice(g,1);commit();renderLibrary();};
window.addGoalToCat=c=>{DB.goalLibrary[c].goals.push('새 관찰 가능한 행동 목표');commit();renderLibrary();};
window.delCat=c=>{if(confirm('이 역량과 하위 목표를 삭제할까요?')){DB.goalLibrary.splice(c,1);commit();renderLibrary();}};
$('#addCat').onclick=()=>openModal('역량 추가','<label class="fld"><span class="l">역량 이름</span><input id="newCat" placeholder="예: 창의성"></label>',()=>{const v=trim($('#newCat').value);if(v){DB.goalLibrary.push({cat:v,goals:[]});commit();renderLibrary();}});

function renderSettings(){
  const noDate=RAW.obs.filter(o=>!o.date).length;
  $('#srcStatus').innerHTML=`<dl class="kv" style="grid-template-columns:120px 1fr">
    <dt>관찰기록</dt><dd>${OBS_TABS.length}개 연구소 탭 · <b>${RAW.obs.length}건</b>${noDate?` <span style="color:var(--warn)">(날짜 미기재 ${noDate}건)</span>`:''}</dd>
    <dt>감정체크</dt><dd>입실·퇴실 · <b>${RAW.emo.length}회</b></dd>
    <dt>기본정보</dt><dd>Member_DB · <b>${Object.keys(RAW.members).length}명</b></dd>
    <dt>팀 공유</dt><dd>npoint.io 실시간 동기화</dd>
    <dt>시트 갱신</dt><dd>${lastSheetSync?`마지막 <b>${new Date(lastSheetSync).toLocaleTimeString('ko-KR')}</b> · 5분마다 자동 갱신`:'대기 중'}</dd></dl>
    <div class="empty-note" style="margin-top:8px">시트는 읽기 전용으로만 접근합니다. 5분마다, 그리고 다른 창을 보다 돌아올 때 자동으로 다시 읽습니다(입력 중에는 건너뜀).</div>`;
  const ph=Object.keys(PHOTOS).length;
  const phKb=Math.round(JSON.stringify(PHOTOS).length/1024);
  const noPh=STUDENTS.filter(s=>!PHOTOS[s.name]).length;
  $('#photoMgr').innerHTML=`<dl class="kv" style="grid-template-columns:120px 1fr">
      <dt>등록된 사진</dt><dd><b>${ph}명</b> · 저장소 ${phKb}KB${noPh?` <span style="color:var(--ink3)">(미등록 ${noPh}명)</span>`:''}</dd></dl>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <label class="btn pri sm">사진 일괄 등록
        <input type="file" accept="image/*" multiple hidden onchange="bulkPhotos(this)"></label>
      <span class="empty-note" style="margin:0">파일 이름이 학생 이름이어야 합니다 (예: 김도영.png)</span>
    </div>
    <div id="bulkStat" class="empty-note" style="margin-top:8px"></div>
    <div class="empty-note" style="margin-top:6px">사진은 150px로 줄여 팀 공유 저장소에 보관되며, 외부 사이트에 올리지 않습니다.</div>`;
  renderStaff();
}
function renderStaff(){
  $('#staffMgr').innerHTML=DB.staff.map((s,i)=>`<div class="lib-goal">
    <input class="txt" style="border:0;background:transparent" value="${esc(s.name)}" onblur="editStaff(${i},'name',this.value)">
    <select onchange="editStaff(${i},'role',this.value)">${['연구원','상담가','리드','센터장'].map(r=>`<option ${s.role===r?'selected':''}>${r}</option>`).join('')}</select>
    <button class="btn ghost sm" onclick="delStaff(${i})">✕</button></div>`).join('');
}
window.editStaff=(i,k,v)=>{DB.staff[i][k]=trim(v);commit();fillMe();};
window.delStaff=i=>{DB.staff.splice(i,1);commit();renderStaff();fillMe();};
$('#addStaff').onclick=()=>{DB.staff.push({name:'새 직원',role:'연구원'});commit();renderStaff();fillMe();};
$('#reloadSheets').onclick=async()=>{setSync('load','새로고침…');await loadAllSheets();toast('시트 새로고침 완료');};
$('#exportData').onclick=()=>{const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fox-growth-backup.json';a.click();};

function fillMe(){const s=$('#meName'),cur=lsGet('foxgrowth.me')||DB.staff[0]?.name;
  s.innerHTML=DB.staff.map(x=>`<option ${x.name===cur?'selected':''}>${esc(x.name)}</option>`).join('');updateRole();}
function updateRole(){const n=$('#meName').value;lsSet('foxgrowth.me',n);const s=DB.staff.find(x=>x.name===n);$('#meRole').textContent=s?s.role:'연구원';}
$('#meName').onchange=updateRole;

/* ===================== MODAL ===================== */
function openModal(t,b,onSave){
  $('#mbox').innerHTML=`<div class="mh">${esc(t)}</div><div class="mc">${b}</div><div class="mf"><button class="btn" id="mC">취소</button><button class="btn pri" id="mS">저장</button></div>`;
  $('#modal').classList.add('on');
  $('#mC').onclick=closeModal;$('#mS').onclick=()=>{onSave&&onSave();closeModal();};
}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ===================== BOOT ===================== */
/* 시트 자동 갱신: 5분 주기 + 탭 복귀 시(2분 이상 지났으면).
   입력 중이거나 탭이 숨겨져 있으면 건너뛰고 다음 주기에 다시 시도한다. */
const SHEET_MS=300000, SHEET_STALE=120000;
function isEditing(){
  const a=document.activeElement;
  return !!a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'||a.isContentEditable);
}
async function loadAllSheets(opt){
  const silent=!!(opt&&opt.silent);
  try{await Promise.all([loadMembers(),loadObservations(),loadEmotions()]);}catch(e){console.error(e);}
  buildStudents();renderLabFilter();
  lastSheetSync=Date.now();
  const ds=$('#dashSub');if(ds)ds.textContent='오늘 확인할 것';
  if(silent)refreshView(); else route();
  setSync('ok',DB.updatedAt?'팀 공유됨':'로컬');
}
async function autoRefreshSheets(){
  if(document.hidden||isEditing())return;          // 입력 중이면 화면을 갈아엎지 않는다
  setSync('load','시트 확인 중…');
  await loadAllSheets({silent:true});
}
function showSkeleton(){
  const sk=n=>Array.from({length:n});
  $('#v-dash').classList.add('on');
  $('#dashBody').innerHTML=`
    <div class="skgrid">${sk(4).map(()=>`<div class="skcard"><div class="skel s1"></div><div class="skel s2"></div><div class="skel s3"></div></div>`).join('')}</div>
    <div class="dcols">
      <div class="card pad"><div class="skel s2" style="height:12px;width:34%;margin-bottom:12px"></div>
        ${sk(5).map(()=>`<div class="skrow"><div class="skel a"></div><div style="flex:1"><div class="skel l1"></div><div class="skel l2"></div></div></div>`).join('')}</div>
      <div class="card pad"><div class="skel s2" style="height:12px;width:28%;margin-bottom:12px"></div>
        ${sk(5).map(()=>`<div class="skrow"><div class="skel a"></div><div style="flex:1"><div class="skel l1"></div><div class="skel l2"></div></div></div>`).join('')}</div>
    </div>`;
  $('#dashSub').textContent='구글시트에서 관찰·감정체크 기록을 불러오는 중입니다…';
}
async function boot(){
  sortMode=lsGet('foxgrowth.sort')||'name';
  loadCache();loadPhotoCache();ensureDefaults();fillMe();
  setSync('load','불러오는 중…');
  showSkeleton();
  await Promise.all([pullDB(),loadPhotos()]);ensureDefaults();fillMe();
  await loadAllSheets();
  setInterval(pullDB,8000);                        // 팀 데이터(앱 입력분)
  setInterval(autoRefreshSheets,SHEET_MS);         // 구글시트 원본
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&Date.now()-lastSheetSync>SHEET_STALE)autoRefreshSheets();
  });
}
boot();
</script>
